[package]
name = "dashboard"
version = "0.1.2"
edition = "2024"

[dependencies]
anyhow = "1.0"
reqwest = { version = "0.13", default-features = false, features = [
    "default-tls",
    "http2",
] }
scraper = "0.27"
tokio = { version = "1.52", features = ["rt-multi-thread", "macros"] }

[profile.release]
incremental = true
strip = true
